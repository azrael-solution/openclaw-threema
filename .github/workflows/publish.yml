name: Publish to npm (Trusted Publishing)

# Publishes openclaw-threema to npm when a version tag (v*) is pushed.
# Uses npm Trusted Publishing (OIDC) — NO long-lived NPM_TOKEN required.
# One-time setup on npmjs.com: add this repo + workflow as a Trusted Publisher
# for the package (Package Settings -> Trusted Publisher -> GitHub Actions).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # REQUIRED for OIDC / Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi

      - name: Build
        run: npm run build

      # npm >= 11.5.1 is required for Trusted Publishing (OIDC).
      - name: Ensure recent npm
        run: npm install -g npm@latest

      - name: Publish (OIDC / provenance)
        run: npm publish --access public --provenance
